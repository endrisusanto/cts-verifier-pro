[package]
name = "cts-verifier-installer"
version = "1.1.0"
description = "CTS Verifier Installer - Android 16"
authors = ["Endri Pro"]
edition = "2021"

[lib]
name = "cts_verifier_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
