name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            zip

      - name: Install frontend dependencies
        run: npm ci

      - name: Build DEB and RPM
        run: npm run tauri build -- --bundles deb,rpm

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build EXE installer
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs:
      - build-linux
      - build-windows
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate release notes
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          cat > RELEASE_NOTES.md <<EOF
          ## CTS Verifier Pro ${TAG_NAME}

          ### Installation Assets
          * **Windows**: Download the \`.exe\` installer.
          * **Linux**: Use \`.deb\` (Debian/Ubuntu) or \`.rpm\` (Fedora/CentOS).

          > [!IMPORTANT]
          > **Resource APKs are NOT included in this release** due to their large size.
          > 1. Download the resource APKs separately.
          > 2. Place them in a \`resources/\` folder next to the installed application.
          > 3. Alternatively, set the environment variable \`CTS_VERIFIER_RESOURCE_DIR\`.

          ---
          *Automated release triggered by tag ${TAG_NAME}*
          EOF

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CTS Verifier Pro ${{ github.ref_name }}"
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/linux-bundles/**/*.deb
            dist/linux-bundles/**/*.rpm
            dist/windows-bundles/**/*.exe
