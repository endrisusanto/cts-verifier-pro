name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            zip

      - name: Install frontend dependencies
        run: npm ci

      - name: Build DEB and RPM
        run: npm run tauri build -- --bundles deb,rpm

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build EXE installer
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  package-resources:
    name: Package external resources
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Create resources archive
        run: |
          test -d src-tauri/apks
          mkdir -p release-assets/resources
          cp -a src-tauri/apks/. release-assets/resources/
          cat > release-assets/resources/README.txt <<'EOF'
          CTS Verifier Pro external resources

          Keep this folder beside the application binary as "resources", or set:
          CTS_VERIFIER_RESOURCE_DIR=/path/to/resources

          Expected structure:
          resources/ApkTest/
          resources/Normal/13/
          resources/Normal/14/
          resources/Normal/15/
          resources/Normal/16/
          EOF
          cd release-assets
          zip -qr cts-verifier-resources.zip resources

      - name: Upload resource artifact
        uses: actions/upload-artifact@v4
        with:
          name: cts-resources
          path: release-assets/cts-verifier-resources.zip
          if-no-files-found: error

  release:
    name: Draft GitHub release
    runs-on: ubuntu-22.04
    needs:
      - build-linux
      - build-windows
      - package-resources
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate release notes
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          cat > RELEASE_NOTES.md <<EOF
          ## CTS Verifier Pro ${TAG_NAME}

          ### Assets
          - Linux installer: \`.deb\`
          - Linux installer: \`.rpm\`
          - Windows installer: \`.exe\`
          - External resources: \`cts-verifier-resources.zip\`

          ### Important
          Installer dan resource dipisah.
          Setelah install aplikasi, ekstrak \`cts-verifier-resources.zip\` menjadi folder \`resources/\` di samping binary, atau set environment variable:

          \`\`\`bash
          CTS_VERIFIER_RESOURCE_DIR=/path/to/resources
          \`\`\`

          Panduan detail ada di README dan GitHub Pages project.
          EOF

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          body_path: RELEASE_NOTES.md
          files: |
            dist/linux-bundles/**/*.deb
            dist/linux-bundles/**/*.rpm
            dist/windows-bundles/**/*.exe
            dist/cts-resources/cts-verifier-resources.zip
