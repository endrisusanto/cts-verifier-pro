name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            zip

      - name: Install frontend dependencies
        run: npm ci

      - name: Build DEB and RPM
        run: npm run tauri build -- --bundles deb,rpm

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build EXE installer
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Draft GitHub release
    runs-on: ubuntu-22.04
    needs:
      - build-linux
      - build-windows
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate release notes
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          cat > RELEASE_NOTES.md <<EOF
          ## CTS Verifier Pro ${TAG_NAME}

          ### Assets
          - Linux installer: \`.deb\`
          - Linux installer: \`.rpm\`
          - Windows installer: \`.exe\`

          ### Important
          Installer dan resource dipisah.
          Resource APK tidak diupload ke GitHub Release karena ukuran file besar.
          Setelah install aplikasi, copy folder resource secara manual menjadi \`resources/\` di samping binary, atau set environment variable:

          \`\`\`bash
          CTS_VERIFIER_RESOURCE_DIR=/path/to/resources
          \`\`\`

          Panduan detail ada di README dan GitHub Pages project.
          EOF

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          body_path: RELEASE_NOTES.md
          files: |
            dist/linux-bundles/**/*.deb
            dist/linux-bundles/**/*.rpm
            dist/windows-bundles/**/*.exe
